name: CareerOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
          

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run check-types

      - name: API unit tests
        run: pnpm --filter careeros-api exec jest --runInBand

      - name: Build workspace
        run: pnpm run build
        env:
          JWT_SECRET: ci-access-secret-minimum-32-characters-long-value
          JWT_REFRESH_SECRET: ci-refresh-secret-minimum-32-characters-long-value
          BYOK_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
